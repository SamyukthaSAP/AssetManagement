_schema-version: 3.3.0
ID: AssetManagement
description: A simple CAP project.
version: 1.0.0
modules:
- name: AssetManagement-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: AssetManagement-auth
  - name: AssetManagement-db
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: AssetManagement-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: AssetManagement-db
  parameters:
    buildpack: nodejs_buildpack
- name: AssetManagement-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: AssetManagement-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - assetlistpage.zip
      name: assetlistpage
      target-path: resources/
    - artifacts:
      - departmentlistreportpage.zip
      name: departmentlistreportpage
      target-path: resources/
    - artifacts:
      - employeelistreportpage.zip
      name: employeelistreportpage
      target-path: resources/
    - artifacts:
      - vendorlistreportpage.zip
      name: vendorlistreportpage
      target-path: resources/
    - artifacts:
      - assetcategorylistreport.zip
      name: assetcategorylistreport
      target-path: resources/
    - artifacts:
      - admindashboard.zip
      name: admindashboard
      target-path: resources/
    - artifacts:
      - userasset.zip
      name: userasset
      target-path: resources/
    - artifacts:
      - assetassignment.zip
      name: assetassignment
      target-path: resources/
    - artifacts:
      - ownershipledger.zip
      name: ownershipledger
      target-path: resources/
    - artifacts:
      - maintenance.zip
      name: maintenance
      target-path: resources/
    - artifacts:
      - archive.zip
      name: archive
      target-path: resources/
- name: AssetManagement-destination-content
  type: com.sap.application.content
  requires:
  - name: AssetManagement-destination-service
    parameters:
      content-target: true
  - name: AssetManagement-auth
  - name: srv-api
  parameters:
    content:
      instance:
        destinations:
        - Authentication: OAuth2UserTokenExchange
          HTML5.DynamicDestination: true
          HTML5.ForwardAuthToken: true
          Name: AssetManagement-srv
          ServiceInstanceName: AssetManagement-auth
          URL: ~{srv-api/srv-url}
          sap.cloud.service: AssetManagement
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: assetlistpage
  type: html5
  path: app/assetlistpage
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: departmentlistreportpage
  type: html5
  path: app/departmentlistreportpage
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: employeelistreportpage
  type: html5
  path: app/employeelistreportpage
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: vendorlistreportpage
  type: html5
  path: app/vendorlistreportpage
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: assetcategorylistreport
  type: html5
  path: app/assetcategorylistreport
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: admindashboard
  type: html5
  path: app/admindashboard
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: userasset
  type: html5
  path: app/userasset
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: assetassignment
  type: html5
  path: app/assetassignment
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: ownershipledger
  type: html5
  path: app/ownershipledger
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: maintenance
  type: html5
  path: app/maintenance
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: archive
  type: html5
  path: app/archive
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: AssetManagement-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      role-collections:
      - description: generated
        name: Admin (AssetManagement ${org}-${space})
        role-template-references:
        - $XSAPPNAME.Admin
      - description: generated
        name: User (AssetManagement ${org}-${space})
        role-template-references:
        - $XSAPPNAME.User
      - description: generated
        name: Manager (AssetManagement ${org}-${space})
        role-template-references:
        - $XSAPPNAME.Manager
      tenant-mode: dedicated
      xsappname: AssetManagement-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: AssetManagement-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: AssetManagement-html5-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
- name: AssetManagement-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: AssetManagement-html5-service
    service-plan: app-host
- name: AssetManagement-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: AssetManagement-destination-service
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
